# Serves the SPA and reverse-proxies both APIs behind this one origin, so the
# browser never has to make a cross-origin request (and phones on the LAN only
# ever need one URL: http://<pi>:<PITUNE_PORT>/).
#
# Caps concurrent connections per source IP — defense-in-depth against one
# already-approved device (e.g. over Tailscale, see ../../tailscale/README.md)
# being compromised and hammering this service, not an access-control
# mechanism on its own. 20 is generous for one real device's normal usage
# (page assets + an open fetch + a streaming <audio> tag) while still
# bounding runaway abuse from a single source.
limit_conn_zone $binary_remote_addr zone=pitune_perip:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    limit_conn pitune_perip 20;

    # `always` so these still apply on error responses (4xx/5xx), not just
    # normal ones — a browser doesn't stop obeying them just because
    # something went wrong. Safe to set unconditionally: the app never
    # frames itself, never runs an inline script, never loads a script or
    # stylesheet from anywhere but itself — img-src is the one exception,
    # for YouTube's own thumbnail CDN in search results.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend: YouTube search + audio streaming.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;        # audio is relayed as it arrives, not batched
        proxy_read_timeout 3600s;   # a long track must not get cut off mid-stream
    }

    # Navidrome's Subsonic API.
    location /rest/ {
        proxy_pass http://navidrome:4533/rest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
