# Serves the SPA and reverse-proxies both APIs behind this one origin, so the
# browser never has to make a cross-origin request (and phones on the LAN only
# ever need one URL: http://<pi>:<PITUNE_PORT>/).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend: YouTube search + audio streaming.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;        # audio is relayed as it arrives, not batched
        proxy_read_timeout 3600s;   # a long track must not get cut off mid-stream
    }

    # Navidrome's Subsonic API.
    location /rest/ {
        proxy_pass http://navidrome:4533/rest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
