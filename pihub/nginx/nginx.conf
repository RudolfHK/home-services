# PiHub's central reverse proxy. Plain nginx:alpine + this one file mounted
# over conf.d/default.conf — no custom image needed.
#
# This is the ONLY container whose port is meant to be reached from other
# devices for day-to-day use (${PIHUB_PORT}, default 80). Everything else —
# homepage, pitune-frontend, jellyfin — is reached through one of the
# path-based routes below, over the compose network only.
#
# Deliberately no `depends_on: condition: service_healthy` pointing at any
# of the upstreams here (see docker-compose.yml). If jellyfin is down or
# still starting, /jellyfin/ 502s — but nginx itself, and therefore every
# OTHER route including the homepage dashboard, keeps working. That's the
# whole "independent services" requirement, expressed as a proxy config
# rather than a health-check gate.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ── Homepage ─────────────────────────────────────────────────────────
    # One container serves both its own UI (at /) and its API (at /api/*),
    # so this is a single proxy_pass rather than the two separate locations
    # the old dashboard + management-api pair needed.
    location / {
        proxy_pass http://homepage:8080/;
        proxy_set_header Host $host;
    }

    # ── PiTune — its own nginx handles /api/ and /rest/ internally once the
    # /pitune/ prefix is stripped here, so this is a single plain proxy_pass.
    location /pitune/ {
        proxy_pass http://pitune-frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ── Jellyfin ──────────────────────────────────────────────────────────
    # Requires a one-time manual step: in Jellyfin's own admin dashboard,
    # set Networking → Base URL to "/jellyfin" and restart the container —
    # otherwise its own links, API calls and websocket paths are generated
    # without the prefix and break under this proxy. See ../README.md.
    location /jellyfin/ {
        proxy_pass http://jellyfin:8096/jellyfin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jellyfin's live UI updates (SignalR) ride over a websocket on this
        # same path — upgrade when asked, otherwise behave like a normal
        # HTTP proxy. $connection_upgrade (defined in the map above) is what
        # lets one location block cover both cases instead of duplicating it.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;        # video is relayed as it arrives
        proxy_read_timeout 3600s;   # a long stream must not get cut off
    }
}
