# PiHub's central reverse proxy. Plain nginx:alpine + this one file mounted
# over conf.d/default.conf — no custom image needed.
#
# This is the ONLY container whose port is meant to be reached from other
# devices for day-to-day use (${PIHUB_PORT}, default 80). Everything else —
# homepage, pitune-frontend, jellyfin — is reached through one of the
# path-based routes below, over the compose network only.
#
# Deliberately no `depends_on: condition: service_healthy` pointing at any
# of the upstreams here (see docker-compose.yml). If jellyfin is down or
# still starting, /jellyfin/ 502s — but nginx itself, and therefore every
# OTHER route including the homepage dashboard, keeps working. That's the
# whole "independent services" requirement, expressed as a proxy config
# rather than a health-check gate.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Caps concurrent connections per source IP — defense-in-depth against one
# already-approved device being compromised and hammering the stack, not an
# access-control mechanism on its own (that's ../tailscale/acl-policy.hujson).
#
# Important limitation: this is only a true PER-DEVICE cap for direct LAN
# clients, since this nginx terminates their connections directly and
# $binary_remote_addr is their real IP. For traffic arriving via the
# optional tailscale profile (see docker-compose.yml), `tailscale serve`
# itself is a reverse-proxy hop — every request it forwards here arrives
# from the tailscale container's own IP, not the original tailnet device's.
# So over Tailscale, the limit below becomes an AGGREGATE cap shared across
# all Tailscale-originated traffic combined, not 20-per-device. Tightening
# that would need `ngx_http_realip_module` (set_real_ip_from / real_ip_header)
# fed by whatever forwarded-for header tailscale serve sets — not configured
# here since that behavior isn't verified against a live tailnet. The real
# per-device access control stays the ACL allowlist, not this directive.
limit_conn_zone $binary_remote_addr zone=pihub_perip:10m;

server {
    listen 80;
    server_name _;

    limit_conn pihub_perip 20;

    # Applied to every location below EXCEPT / (homepage) — nginx's
    # add_header inheritance is all-or-nothing per location, so the block
    # below that adds a Content-Security-Policy on top has to repeat these
    # three rather than relying on inheriting them from here. Deliberately
    # no CSP at this level: pitune-frontend already sets its own (a second,
    # different one added here on top would give the browser two headers
    # to intersect, not one policy — see that container's nginx.conf), and
    # Jellyfin's own player needs blob:/worker-src allowances for
    # transcoding that aren't safe to guess at from outside its own app.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Homepage ─────────────────────────────────────────────────────────
    # One container serves both its own UI (at /) and its API (at /api/*),
    # so this is a single proxy_pass rather than the two separate locations
    # the old dashboard + management-api pair needed.
    location / {
        proxy_pass http://homepage:8080/;
        proxy_set_header Host $host;

        # homepage's own FastAPI app sets these same four headers itself
        # (so the standalone deployment, with no nginx in front, is
        # protected too — see homepage/backend/main.py). Hide its copies
        # here so the client gets exactly the one set below, not two of
        # each — duplicate simple headers are harmless, but a duplicate
        # Content-Security-Policy has the browser intersect two policies
        # instead of applying one.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;

        # Repeated here (see the comment above) rather than inherited, plus
        # the one header that's genuinely specific to this location: a CSP
        # is safe to set precisely for homepage's own frontend (no external
        # images, no inline scripts/styles, one same-origin API) in a way
        # it would not be to guess at for Jellyfin's or pitune's.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # ── PiTune — its own nginx handles /api/ and /rest/ internally once the
    # /pitune/ prefix is stripped here, so this is a single plain proxy_pass.
    location /pitune/ {
        proxy_pass http://pitune-frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ── Jellyfin ──────────────────────────────────────────────────────────
    # Requires a one-time manual step: in Jellyfin's own admin dashboard,
    # set Networking → Base URL to "/jellyfin" and restart the container —
    # otherwise its own links, API calls and websocket paths are generated
    # without the prefix and break under this proxy. See ../README.md.
    location /jellyfin/ {
        proxy_pass http://jellyfin:8096/jellyfin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jellyfin's live UI updates (SignalR) ride over a websocket on this
        # same path — upgrade when asked, otherwise behave like a normal
        # HTTP proxy. $connection_upgrade (defined in the map above) is what
        # lets one location block cover both cases instead of duplicating it.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;        # video is relayed as it arrives
        proxy_read_timeout 3600s;   # a long stream must not get cut off
    }
}
