<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PiHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>PiHub</h1>
    <div class="stats-bar" id="stats-bar">
      <div class="stat"><span class="stat-label">CPU</span><span class="stat-value" id="stat-cpu">–</span></div>
      <div class="stat"><span class="stat-label">Temp</span><span class="stat-value" id="stat-temp">–</span></div>
      <div class="stat"><span class="stat-label">RAM</span><span class="stat-value" id="stat-ram">–</span></div>
      <div class="stat"><span class="stat-label">Disk</span><span class="stat-value" id="stat-disk">–</span></div>
      <div class="stat"><span class="stat-label">Uptime</span><span class="stat-value" id="stat-uptime">–</span></div>
    </div>
  </header>

  <main id="services"></main>

  <div id="log-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span id="log-modal-title">Logs</span>
        <button id="log-modal-close">✕</button>
      </div>
      <pre id="log-modal-body"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
