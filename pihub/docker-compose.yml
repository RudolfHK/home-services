# docker-compose.yml — PiHub: homepage + PiTune + Jellyfin, each independent.
#
# Every service belongs to exactly one Compose profile — "core" (nginx +
# autoheal, always on), "homepage", "pitune", or "jellyfin" — and
# COMPOSE_PROFILES in .env decides which profiles a bare `docker compose up
# -d` brings up. The `pihub` CLI script and the homepage dashboard both
# operate at this same profile/product granularity (start/stop "pitune" as a
# whole, not its three containers individually).
#
# Independence is the point: nothing here uses `depends_on: condition:
# service_healthy` across a product boundary. pitune-frontend depends on
# navidrome/pitune-backend because that's PiTune's OWN internal wiring, and
# nginx starts without waiting on anything — if jellyfin is down, /jellyfin/
# just 502s, but the dashboard and PiTune are unaffected. See nginx/nginx.conf
# and README.md.
#
# "Restart on health failure" is NOT something a bare `restart:` policy gives
# you — Docker only restarts a container when its process exits, not when a
# healthcheck merely reports "unhealthy" while the process is still running.
# The `autoheal` service below is what actually closes that gap: it watches
# every container labelled `autoheal=true` and kills it the moment Docker
# marks it unhealthy, so `restart: unless-stopped` can then bring it back.
#
# NOTE: no top-level `version:` key — it is obsolete in Compose v2.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ══════════════════════════════════════════════════════════════════════
  # Core — reverse proxy, dashboard, management API. Always on.
  # ══════════════════════════════════════════════════════════════════════

  nginx:
    profiles: ["core"]
    image: nginx:alpine
    container_name: pihub-nginx
    restart: unless-stopped
    logging: *default-logging

    # Deliberately no depends_on here at all (see the file header) — nginx
    # must come up regardless of any other service's state.
    ports:
      - "${PIHUB_PORT:-80}:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"

  # ══════════════════════════════════════════════════════════════════════
  # Homepage — the unified status dashboard (replaces the old dashboard +
  # management-api pair with one config-driven service; see homepage/README.md)
  # ══════════════════════════════════════════════════════════════════════

  homepage:
    profiles: ["homepage"]
    build: ./homepage
    container_name: pihub-homepage
    restart: unless-stopped
    logging: *default-logging

    environment:
      # Empty, not "*": the frontend and API are always served from the
      # same origin here (this one container, reached through nginx), so
      # legitimate use never needs a cross-origin allowance — only set this
      # if you're running a separate frontend against this API directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MEDIA_PATH: /media
      # Required to use start/stop/restart/logs — see homepage/README.md's
      # security model. scripts/setup.sh generates this; if you're not
      # using it, set your own with `openssl rand -hex 32`.
      API_TOKEN: ${API_TOKEN:-}
      # Talks to docker-proxy instead of a raw mounted socket — docker-py's
      # from_env() reads DOCKER_HOST exactly like the real docker CLI does,
      # so docker_monitor.py needed no code change for this. See
      # docker-proxy's own comment above for what it does and doesn't allow.
      DOCKER_HOST: tcp://docker-proxy:2375

    depends_on:
      - docker-proxy

    volumes:
      - /proc:/host/proc:ro
      - /sys/class/thermal:/host/thermal:ro
      # Read-only, and shutil.disk_usage() never reads file contents — only
      # filesystem-level stat — but this is still the broadest mount in
      # this stack, present only because "boot drive space" is an explicit
      # feature (see homepage/backend/system_stats.py). Comment out both
      # this line and BOOT_PATH's use if you'd rather not.
      - /:/hostroot:ro
      - ./homepage/config:/app/config
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media
        read_only: true
        bind:
          create_host_path: false

    security_opt:
      - no-new-privileges:true

    healthcheck:
      # No curl/wget in the base python:3.12-slim image.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"

  # Watches every container labelled autoheal=true and kills (not just
  # flags) it on the first unhealthy report, letting `restart: unless-
  # stopped` do the actual restart. See the file header for why this exists.
  autoheal:
    profiles: ["core"]
    image: willfarrell/autoheal:latest
    container_name: pihub-autoheal
    restart: unless-stopped
    logging: *default-logging

    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    security_opt:
      - no-new-privileges:true

  # Filters the Docker API down to exactly what homepage needs, so a bug or
  # a compromised dependency in that FastAPI app (an HTTP API parsing
  # external YAML/JSON, unlike autoheal's small fixed bash loop, which keeps
  # its own direct socket mount above) can't turn into arbitrary root-
  # equivalent access via the socket. EXEC=0 in particular: nothing left in
  # this stack needs it, now that pitune-backend exposes its own yt-dlp
  # version over HTTP instead of homepage exec-ing into it — see
  # homepage/backend/system_stats.py.
  #
  # Profiles list both "core" and "homepage", not just "core": homepage
  # depends_on this, and Compose refuses to even parse the file — for ANY
  # command, not just up — if a depends_on target's profile isn't active
  # alongside the dependent service's. Narrowing .env to homepage without
  # core would otherwise break the whole compose file, not just skip this
  # one service.
  docker-proxy:
    profiles: ["core", "homepage"]
    image: tecnativa/docker-socket-proxy:latest
    container_name: pihub-docker-proxy
    restart: unless-stopped
    logging: *default-logging

    environment:
      CONTAINERS: 1   # list/inspect containers — status, uptime, health
      IMAGES: 1        # inspect local images — the update-freshness check
      POST: 1          # start/stop/restart act via POST
      DISTRIBUTION: 1  # registry manifest lookups — also the update check
      EXEC: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SWARM: 0
      SYSTEM: 0
      PLUGINS: 0
      SECRETS: 0
      CONFIGS: 0
      BUILD: 0
      COMMIT: 0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    security_opt:
      - no-new-privileges:true

  # ══════════════════════════════════════════════════════════════════════
  # PiTune — local music (Navidrome) + YouTube audio (yt-dlp backend)
  # ══════════════════════════════════════════════════════════════════════

  navidrome:
    profiles: ["pitune"]
    image: deluan/navidrome:${NAVIDROME_TAG:-latest}
    container_name: pihub-navidrome
    restart: unless-stopped
    logging: *default-logging

    user: "${PUID}:${PGID}"

    # Published directly (not just reverse-proxied) so you can reach
    # Navidrome's own admin UI to create the account PiTune's Library tab
    # logs in with — that account management has to happen here, PiHub
    # doesn't reimplement it.
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"

    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_LOGLEVEL: ${ND_LOGLEVEL:-info}
      ND_SCANSCHEDULE: ${ND_SCANSCHEDULE:-@every 1h}
      TZ: ${TZ}

    volumes:
      - type: bind
        source: ${MEDIA_ROOT}/music
        target: /music
        read_only: true
        bind:
          create_host_path: false
      # Read-only: this is PiTune's yt-dlp downloads folder, not the curated
      # library. Add it as a SECOND library from Navidrome's admin UI
      # (Settings → Libraries) if you want saved YouTube tracks to show up —
      # see pihub/pitune/backend/app/main.py.
      - type: bind
        source: ${MEDIA_ROOT}/downloads
        target: /downloads
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NAVIDROME_DATA_PATH}
        target: /data
        bind:
          create_host_path: false

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4533/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "autoheal=true"

  pitune-backend:
    profiles: ["pitune"]
    build: ./pitune/backend
    container_name: pihub-pitune-backend
    restart: unless-stopped
    logging: *default-logging

    environment:
      TZ: ${TZ}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-20}
      DOWNLOAD_ENABLED: ${DOWNLOAD_ENABLED:-false}
      # Empty, not "*" — see app/main.py's CORS_ORIGINS comment.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Protects /api/save when DOWNLOAD_ENABLED=true — see app/main.py.
      API_TOKEN: ${API_TOKEN:-}
      DOWNLOADS_PATH: /downloads
      # yt-dlp caches the expensive part of extraction here (notably the
      # parsed player-JS signature/nsig functions), keyed by YouTube player
      # version — reused across requests AND, with this on a named volume,
      # across container restarts/updates too. Every /api/stream request
      # already extracts a video's metadata twice (once to resolve Content-
      # Type before the response starts, once more inside the actual yt-dlp
      # subprocess) — without a persistent cache dir, a fresh container
      # pays full extraction cost on both of those for every single track.
      XDG_CACHE_HOME: /cache

    volumes:
      # rw: this IS the writer for /api/save. Scoped to downloads/ only —
      # never the music/ library itself. See app/main.py.
      - type: bind
        source: ${MEDIA_ROOT}/downloads
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${YTDLP_COOKIES_HOST_FILE:-/dev/null}
        target: /config/cookies.txt
        read_only: true
        bind:
          create_host_path: false
      - ytdlp-cache:/cache

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"

  pitune-frontend:
    profiles: ["pitune"]
    build: ./pitune/frontend
    container_name: pihub-pitune-frontend
    restart: unless-stopped
    logging: *default-logging

    # PiTune's own internal composition (not a cross-product dependency —
    # see the file header) — its nginx proxies /api/ and /rest/ to these.
    depends_on:
      pitune-backend:
        condition: service_healthy
      navidrome:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"

  # ══════════════════════════════════════════════════════════════════════
  # Jellyfin — video / movie / TV library
  # ══════════════════════════════════════════════════════════════════════

  jellyfin:
    profiles: ["jellyfin"]
    image: jellyfin/jellyfin:${JELLYFIN_TAG:-latest}
    container_name: pihub-jellyfin
    restart: unless-stopped
    logging: *default-logging

    # Published directly in addition to /jellyfin/ — handy for the one-time
    # Base URL setup step (see nginx/nginx.conf) and for troubleshooting
    # hardware transcoding without the proxy in the way.
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"

    environment:
      TZ: ${TZ}

    volumes:
      - type: bind
        source: ${JELLYFIN_CONFIG_PATH}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_ROOT}/videos
        target: /media/videos
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_ROOT}/movies
        target: /media/movies
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_ROOT}/shows
        target: /media/shows
        read_only: true
        bind:
          create_host_path: false

    # V4L2 stateless decode devices — this is the standard device layout on
    # Raspberry Pi OS's kernel (Pi 5 decodes; it does NOT hardware-encode, so
    # this only ever helps as a fallback — direct play stays strictly
    # preferred, see README.md). If these paths don't exist on your board
    # (non-Pi hardware, or a kernel without V4L2 stateless codecs), comment
    # this whole block out — Jellyfin still runs fine on software decoding.
    devices:
      - /dev/video10:/dev/video10
      - /dev/video11:/dev/video11
      - /dev/video12:/dev/video12

    security_opt:
      - no-new-privileges:true

    healthcheck:
      # Deliberately NOT an HTTP path check. Setting Base URL (the one-time
      # step this stack's README requires — see nginx/nginx.conf) moves ALL
      # of Jellyfin's own routes under that prefix, /health included. A
      # healthcheck hardcoded to /health would pass before that step and
      # start failing forever right after it — and autoheal would then
      # kill-loop a perfectly healthy container. A bare TCP connect proves
      # the server is accepting connections without caring what path it
      # answers on, so it stays correct on both sides of that setup step.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8096' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"

  # ══════════════════════════════════════════════════════════════════════
  # Tailscale (optional) — reach PiHub from outside the LAN
  # ══════════════════════════════════════════════════════════════════════
  # Off by default: only starts as part of the "tailscale" profile
  # (`pihub start tailscale`, or `docker compose --profile tailscale up
  # -d`). PIHUB_PORT, NAVIDROME_PORT and JELLYFIN_PORT are completely
  # unaffected either way — this is an ADDITIONAL way in, not a replacement.
  #
  # Stays on the normal compose network rather than using `network_mode:
  # service:tailscale` (which would force nginx to give up its own `ports:`
  # mapping) — `tailscale serve` proxies to the existing central `nginx`
  # service by its Docker DNS name instead, which already does all the
  # /pitune/, /jellyfin/ path routing internally (see tailscale/serve.json).
  #
  # Before enabling this: apply ../tailscale/acl-policy.hujson to your
  # tailnet first. Without it, once this node joins the tailnet, EVERY
  # port it has open — including NAVIDROME_PORT, JELLYFIN_PORT and even
  # PIHUB_PORT itself — becomes reachable by any tailnet member, not just
  # the :443 endpoint below. See ../tailscale/README.md.

  # Hard gate, not just a doc warning: refuses to let `tailscale` (below)
  # start at all if API_TOKEN is unset. Without this, enabling remote
  # access on a box that never needed a token for pure-LAN use silently
  # hands every approved tailnet device unauthenticated start/stop/
  # restart/logs control over every container via homepage. This container
  # exits 1 with an explicit error instead, and Compose refuses to start
  # `tailscale` when it does (see that service's `depends_on: condition:
  # service_completed_successfully`). A one-shot check like this can't live
  # inside the `tailscale/tailscale` image itself, hence the separate tiny
  # container.
  tailscale-preflight:
    profiles: ["tailscale"]
    image: alpine:3.20
    container_name: pihub-tailscale-preflight
    restart: "no"
    logging: *default-logging
    environment:
      API_TOKEN: ${API_TOKEN:-}
    command:
      - sh
      - -c
      - |
        if [ -z "$$API_TOKEN" ]; then
          echo "FATAL: API_TOKEN is unset, and the tailscale profile is" >&2
          echo "starting. Once this node is reachable from outside the LAN," >&2
          echo "homepage's start/stop/restart/logs endpoints would have NO" >&2
          echo "auth at all, reachable by every approved tailnet device." >&2
          echo "Set API_TOKEN in .env (see .env.example) first." >&2
          exit 1
        fi
        echo "tailscale-preflight: OK."

  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:${TAILSCALE_TAG:-latest}
    container_name: pihub-tailscale
    hostname: ${TS_HOSTNAME:-pihub}
    restart: unless-stopped
    logging: *default-logging

    # Deliberately no depends_on on nginx: it's in a different profile
    # ("core"), and Compose refuses to even parse the file if a depends_on
    # target's profile isn't active alongside the dependent service's (the
    # exact issue docker-proxy's own comment above already documents for
    # homepage). Not health-gated anyway — if nginx isn't up yet, `tailscale
    # serve` just retries its proxy connection until it is. tailscale-preflight
    # (same "tailscale" profile, no cross-profile issue) IS a hard gate — see
    # its own comment above.
    depends_on:
      tailscale-preflight:
        condition: service_completed_successfully

    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-pihub}
      TS_SERVE_CONFIG: /config/tailscale/serve.json
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "true"
      # e.g. --advertise-tags=tag:pihub-server — see ../tailscale/acl-policy.hujson.
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_STATE_DIR: /var/lib/tailscale
      TZ: ${TZ}

    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config/tailscale:ro
      - /dev/net/tun:/dev/net/tun

    cap_add:
      - NET_ADMIN
      - NET_RAW

    security_opt:
      - no-new-privileges:true

    healthcheck:
      # See home-drive/docker-compose.yml's identical check for why this
      # asserts on BackendState specifically rather than the exit code.
      test:
        - CMD-SHELL
        - "tailscale status --json | tr -d '[:space:]' | grep -q '\"BackendState\":\"Running\"'"
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 45s

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  ytdlp-cache:      # yt-dlp's extractor cache (see pitune-backend's environment)
  tailscale-state:  # Tailscale auth/state — only used if the tailscale profile runs
