# Serves the SPA and reverse-proxies both APIs behind this one origin, so the
# browser never has to make a cross-origin request.
#
# In PiHub, this whole container sits behind the central nginx at /pitune/
# (see ../../nginx/nginx.conf), which strips that prefix before forwarding
# here — so every path below is still root-relative from this container's
# own point of view, and none of this needed to change from the standalone
# pitune/ stack it was adapted from.
#
# One thing that DID need to move rather than copy: the standalone stack's
# per-source-IP `limit_conn` (see ../../../pitune/frontend/nginx.conf) isn't
# here. Every request into this container arrives already proxied through
# ../../nginx/nginx.conf, so $binary_remote_addr here would always be that
# one internal proxy, never the real client — the limit only means anything
# at the layer that actually terminates client connections. See that file's
# own limit_conn instead.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Needed for the same reason ../../nginx/nginx.conf
    # needs it (see that file's own `resolver` comment): a literal
    # `proxy_pass http://pitune-backend:8000/...;` resolves that hostname
    # once, when this nginx starts, never again. scripts/update-yt-dlp.sh
    # rebuilds and recreates ONLY pitune-backend (a new container, a new IP)
    # specifically to pick up a newer yt-dlp release, so running the exact
    # maintenance command meant to fix search/playback would otherwise leave
    # THIS nginx 502ing every /api/ call until it's separately restarted too.
    resolver 127.0.0.11 valid=10s;

    # `always` so these still apply on error responses (4xx/5xx), not just
    # normal ones — a browser doesn't stop obeying them just because
    # something went wrong. Safe to set unconditionally: the app never
    # frames itself, never runs an inline script, never loads a script or
    # stylesheet from anywhere but itself — img-src is the one exception,
    # for YouTube's own thumbnail CDN in search results.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend: YouTube search + audio streaming.
    location /api/ {
        # Variable, not a literal hostname, so `resolver` above actually
        # re-resolves this (see that comment) instead of caching the IP
        # forever. $request_uri appended explicitly since the automatic
        # location-prefix substitution a literal proxy_pass would have done
        # never applies to a variable target anyway; here that
        # substitution was always a no-op ("/api/" matching "/api/"), so
        # passing the original URI through unchanged is correct either way.
        set $upstream_pitune_backend http://pitune-backend:8000;
        proxy_pass $upstream_pitune_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;        # audio is relayed as it arrives, not batched
        proxy_read_timeout 3600s;   # a long track must not get cut off mid-stream
    }

    # Navidrome's Subsonic API.
    location /rest/ {
        # Same reasoning as /api/ above: variable for `resolver` to apply,
        # substitution was a no-op regardless ("/rest/" matching "/rest/").
        set $upstream_navidrome http://navidrome:4533;
        proxy_pass $upstream_navidrome$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
