# docker-compose.yml — Home Drive stack
# Nextcloud (+ Postgres + Redis + cron), reachable directly on the LAN like
# every other stack in this repo, with an optional Tailscale profile for
# remote access. See ../tailscale/README.md and README.md's Tailscale section.
#
# NOTE: no top-level `version:` key — it is obsolete in Compose v2 and only
# produces a warning on every invocation.

# ── Shared logging policy ────────────────────────────────────────────────────
# Docker's default json-file driver grows without bound. On a Pi that means the
# SD card fills up and the OS wedges. Cap every service at 30 MB total.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Fixed subnet, not Compose's usual auto-assigned one, because Nextcloud's own
# `trusted_proxies` config (config/nextcloud/zz-homedrive.config.php) has to
# name a CIDR range up front: it needs to trust `nextcloud-web` (the only
# thing that ever talks to `nextcloud-app` directly) to report the real
# client IP and protocol correctly, for both the LAN path and the optional
# Tailscale path. An auto-assigned subnet can change across a `docker compose
# down`/`up`, silently breaking that trust relationship.
networks:
  default:
    name: homedrive_net
    ipam:
      config:
        - subnet: 10.89.0.0/24

services:

  # ── 1. Nextcloud ─────────────────────────────────────────────────────────
  # Browser UI, desktop and mobile sync clients, users, sharing, versioning,
  # and — the reason it's Nextcloud rather than something lighter — real
  # file locking. See README.md's "How the corruption protection works".
  #
  # Four containers:
  #   nextcloud-db     PostgreSQL      internal only, no published port
  #   nextcloud-redis  Redis           internal only, no published port
  #   nextcloud-app    PHP-FPM         internal only, no published port
  #   nextcloud-web    nginx           ${NEXTCLOUD_PORT:-80} on the LAN
  #   nextcloud-cron   background jobs (no listener)
  #
  # Nothing here uses `network_mode: service:tailscale` — this stack reaches
  # the LAN directly like PiHub, with Tailscale as an optional sidecar
  # further down. `nextcloud-db`/`nextcloud-redis`/`nextcloud-app` publish no
  # host port at all, so they're reachable only from other containers on
  # `homedrive_net`, never from the LAN or the tailnet.

  nextcloud-db:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    container_name: homedrive-nextcloud-db
    restart: unless-stopped
    logging: *default-logging

    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      # Postgres refuses to initialise into a directory it considers non-empty
      # or wrongly owned; PGDATA in a subdirectory of the mount sidesteps both.
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ}

    volumes:
      - type: bind
        source: ${DATA_PATH}/nextcloud/db
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

    security_opt:
      - no-new-privileges:true

    healthcheck:
      # `-h 127.0.0.1` forces this over TCP rather than the default Unix
      # socket, and that's load-bearing, not cosmetic. A brand-new PGDATA
      # goes through a throwaway `initdb` server before the real one: that
      # first server binds ONLY the Unix socket, never TCP, and a socket-only
      # `pg_isready` (no -h) reports healthy during that window. nextcloud-app
      # depends on this container being service_healthy and then connects
      # over TCP (this network has no sockets to share), so a premature
      # "healthy" here meant it started, hit "connection refused", spent its
      # own limited internal retries, and gave up — writing no config.php,
      # forever, since Nextcloud's automatic install runs exactly once per
      # container start. Testing TCP specifically means this only reports
      # healthy once the REAL server is the one answering.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${NEXTCLOUD_DB_USER:-nextcloud} -d ${NEXTCLOUD_DB_NAME:-nextcloud}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nextcloud-redis:
    image: redis:${REDIS_TAG:-7-alpine}
    container_name: homedrive-nextcloud-redis
    restart: unless-stopped
    logging: *default-logging

    environment:
      TZ: ${TZ}
      # redis-cli picks this up on its own, which keeps the password out of the
      # healthcheck command line — and the healthcheck runs every 30 seconds.
      REDISCLI_AUTH: ${NEXTCLOUD_REDIS_PASSWORD}

    # Redis is what makes Nextcloud's transactional file locking work — the
    # mechanism that stops two writers corrupting one file. It is not
    # optional here. Password-protected on top of not publishing a port at
    # all: only other containers on homedrive_net can even attempt to reach
    # it, and they need the password too.
    command:
      - redis-server
      - --requirepass
      - ${NEXTCLOUD_REDIS_PASSWORD}
      - --save
      - "900"
      - "1"
      - --maxmemory
      - ${NEXTCLOUD_REDIS_MAXMEM:-256mb}
      - --maxmemory-policy
      - allkeys-lru

    volumes:
      - type: bind
        source: ${DATA_PATH}/nextcloud/redis
        target: /data
        bind:
          create_host_path: false

    # NO cap_drop: ALL here, deliberately. The redis entrypoint starts as
    # root, chowns /data, and drops to the redis user with su-exec/setpriv,
    # which needs CAP_CHOWN, CAP_SETUID and CAP_SETGID. Dropping all
    # capabilities makes that switch fail with "Operation not permitted",
    # and the only visible symptom is `dependency failed to start:
    # container homedrive-nextcloud-redis is unhealthy`.
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nextcloud-app:
    # Debian-based fpm image on purpose: www-data is uid 33, the number every
    # Nextcloud document assumes. The -alpine variant uses uid 82, and the
    # mismatch shows up as a data directory Nextcloud cannot write to.
    # install.sh asks the image for the real uid rather than trusting this.
    image: nextcloud:${NEXTCLOUD_TAG:-stable-fpm}
    container_name: homedrive-nextcloud-app
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy

    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}

      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PORT: "6379"
      REDIS_HOST_PASSWORD: ${NEXTCLOUD_REDIS_PASSWORD}

      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # Nextcloud refuses any request whose Host header is not listed here.
      # Needs BOTH access paths: the plain LAN hostname/IP you actually type
      # into a browser, and the tailnet FQDN for the optional Tailscale
      # profile further down.
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_LAN_HOSTNAME} ${TS_HOSTNAME}.${TS_TAILNET} localhost 127.0.0.1

      PHP_MEMORY_LIMIT: ${NEXTCLOUD_PHP_MEMORY:-512M}
      PHP_UPLOAD_LIMIT: ${NEXTCLOUD_UPLOAD_LIMIT:-16G}
      TZ: ${TZ}

    volumes:
      # Application code. A named volume, not a bind: the entrypoint unpacks and
      # upgrades the whole tree here, and it must not live on the data drive
      # where a missing mount would leave a half-written Nextcloud behind.
      - nextcloud-html:/var/www/html
      # User files and config DO go on the external drive.
      - type: bind
        source: ${DATA_PATH}/nextcloud/data
        target: /var/www/html/data
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_PATH}/nextcloud/config
        target: /var/www/html/config
        bind:
          create_host_path: false

    security_opt:
      - no-new-privileges:true

    healthcheck:
      # Prove the FastCGI socket is actually accepting connections rather than
      # merely that the process exists. No extra tooling in the image is needed:
      # PHP itself can open the socket.
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # The very first start unpacks the whole application into an empty volume
      # and runs the installer, which on a Pi takes minutes.
      start_period: 300s

  nextcloud-web:
    image: nginx:${NGINX_TAG:-alpine}
    container_name: homedrive-nextcloud-web
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      nextcloud-app:
        condition: service_healthy

    # The one LAN-facing port for this stack, matching PiHub's
    # convention: reachable on your home network with no VPN client needed.
    # Plain HTTP, same accepted tradeoff as the rest of this repo ("personal
    # use on a home network only" — see README.md's Security model). The
    # optional Tailscale profile below is what gets you a real HTTPS cert,
    # for reaching it from outside the LAN.
    ports:
      - "${NEXTCLOUD_PORT:-80}:80"

    environment:
      TZ: ${TZ}

    volumes:
      # Read-only view of the same application tree: nginx serves the static
      # assets itself and hands .php to fpm.
      - nextcloud-html:/var/www/html:ro
      - ./config/nextcloud/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/status.php || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  nextcloud-cron:
    image: nextcloud:${NEXTCLOUD_TAG:-stable-fpm}
    container_name: homedrive-nextcloud-cron
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      nextcloud-db:
        condition: service_healthy

    # Nextcloud's background jobs (versions expiry, trash cleanup, file scans,
    # and releasing locks whose owner went away) only run if something calls
    # cron.php. Without this container the admin overview shows a permanent
    # "last background job ran a long time ago" warning and stale locks survive.
    entrypoint: /cron.sh

    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PORT: "6379"
      REDIS_HOST_PASSWORD: ${NEXTCLOUD_REDIS_PASSWORD}
      TZ: ${TZ}

    volumes:
      - nextcloud-html:/var/www/html
      - type: bind
        source: ${DATA_PATH}/nextcloud/data
        target: /var/www/html/data
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_PATH}/nextcloud/config
        target: /var/www/html/config
        bind:
          create_host_path: false

    security_opt:
      - no-new-privileges:true

  # ── 2. Tailscale (optional) — reach the drive from outside the LAN ───────
  # Off by default: only starts with `docker compose --profile tailscale up
  # -d` (or `up -d tailscale`). NEXTCLOUD_PORT above is completely
  # unaffected either way — this is an ADDITIONAL way in, not a replacement.
  #
  # Stays on the normal compose network and `tailscale serve` proxies to
  # `nextcloud-web` by its Docker DNS name, the same pattern PiHub
  # already use — see ../tailscale/README.md.
  #
  # Before enabling this: apply ../tailscale/acl-policy.hujson to your
  # tailnet first. Without it, once this node joins the tailnet, its LAN
  # port becomes reachable by any tailnet member, not just the :443
  # endpoint below.
  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:${TAILSCALE_TAG:-latest}
    container_name: homedrive-tailscale
    hostname: ${TS_HOSTNAME:-homepi}
    restart: unless-stopped
    logging: *default-logging

    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-homepi}
      TS_SERVE_CONFIG: /config/tailscale/serve.json
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "true"
      # e.g. --advertise-tags=tag:home-drive-server — see ../tailscale/acl-policy.hujson.
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_STATE_DIR: /var/lib/tailscale
      TZ: ${TZ}

    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config/tailscale:ro
      - /dev/net/tun:/dev/net/tun

    cap_add:
      - NET_ADMIN
      - NET_RAW

    security_opt:
      - no-new-privileges:true

    healthcheck:
      # `tailscale status` exits 0 while the backend is still NeedsLogin or
      # Starting, so testing the exit code alone would let dependent services
      # start before the tailnet is actually up. Assert on BackendState instead.
      #
      # `tailscale status --json` PRETTY-PRINTS its output (json.MarshalIndent),
      # so the raw line reads `"BackendState": "Running",` WITH a space after the
      # colon. Strip all whitespace first, or a `"BackendState":"Running"` match
      # never fires and the container sits in `health: starting` forever.
      test:
        - CMD-SHELL
        - "tailscale status --json | tr -d '[:space:]' | grep -q '\"BackendState\":\"Running\"'"
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 45s

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  nextcloud-html:    # Nextcloud application code (managed by the image)
  tailscale-state:   # Tailscale auth/state — only used if the tailscale profile runs
