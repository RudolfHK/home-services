; CouchDB local configuration for Obsidian Self-hosted LiveSync
; This file is mounted read-only into the couchdb container.
; After changing this file, restart couchdb: docker compose restart couchdb

[couchdb]
; Run as a single node (no clustering)
single_node = true

; Maximum database file size.  Increase if you have huge attachments.
max_dbs_open = 500

[chttpd]
; Enable CORS so the Obsidian mobile app (capacitor://) and desktop app
; (app://obsidian.md) can reach CouchDB from a different origin.
enable_cors = true

; Bind only to localhost — Tailscale's serve proxy forwards requests here.
bind_address = 127.0.0.1
port = 5984

; Increase the request body limit for large vault syncs (default is 4GB).
; Obsidian LiveSync sends binary attachments; 4GB is safe for most vaults.
max_http_request_size = 4294967296

[cors]
; Origins that are allowed to make cross-origin requests.
; - app://obsidian.md          → Obsidian desktop (Electron)
; - capacitor://localhost      → Obsidian iOS / Android (Capacitor)
; - http://localhost           → local dev / testing
origins = app://obsidian.md,capacitor://localhost,http://localhost

; Allow cookies / credentials in CORS requests (required by LiveSync auth)
credentials = true

; Allowed HTTP methods
methods = GET, PUT, POST, HEAD, DELETE, COPY

; Headers the browser is allowed to read from the response
headers = accept, authorization, content-type, origin, referer, x-csrf-token

[couch_httpd_auth]
; Require authentication for all requests (no anonymous reads)
require_valid_user = true

; Session timeout in seconds (10 hours — comfortable for sync background tasks)
timeout = 36000

[log]
; Set to 'warning' in production to reduce noise; 'info' is useful during setup
level = warning

[compactions]
; Automatically compact databases when they grow more than 20% above their
; minimum size.  Keeps disk usage in check on the external SSD.
_default = [{db_fragmentation, "20%"}, {view_fragmentation, "20%"}]
