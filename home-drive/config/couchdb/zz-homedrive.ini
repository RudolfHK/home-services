; CouchDB configuration for Obsidian Self-hosted LiveSync.
;
; Mounted read-only at /opt/couchdb/etc/local.d/zz-homedrive.ini.
;
; WHY local.d AND WHY THE `zz-` PREFIX:
; CouchDB reads its config in this order, later files winning:
;     default.ini → default.d/*.ini → local.ini → local.d/*.ini
; and files inside a .d directory are read in sorted filename order.
; The official image ships local.d/10-docker-default.ini (which sets
; `[chttpd] bind_address = any`) and its entrypoint writes local.d/docker.ini
; (the [admins] block) on every start. Settings placed in local.ini would be
; silently overridden by both. `zz-` sorts last, so this file wins.
;
; After changing this file: docker compose restart couchdb

[couchdb]
; Run as a single node — this also makes CouchDB create the mandatory system
; databases (_users, _replicator, _global_changes) on first boot, which
; LiveSync needs. Without it you must POST to /_cluster_setup by hand.
single_node = true

; Maximum number of database files kept open at once (LRU cache size),
; NOT a file-size limit. 500 is far more than a personal vault needs but
; costs nothing until the handles are actually used.
max_dbs_open = 500

; Largest single document LiveSync may store. The CouchDB default (4 GB) is
; effectively unlimited; LiveSync's own docs recommend capping this so a
; runaway chunk cannot wedge the database. 50 MB comfortably fits its chunks.
max_document_size = 50000000

[chttpd]
; Bind to loopback only. Every service in this stack shares the tailscale
; container's network namespace, so 127.0.0.1 is reachable by `tailscale serve`
; but NOT directly on the tailnet IP — clients cannot skip the HTTPS proxy and
; talk plaintext HTTP to CouchDB.
bind_address = 127.0.0.1
port = 5984

; Reject anonymous requests. In CouchDB 3.x this key belongs to [chttpd]
; (the clustered port); the CouchDB 1.x-era [couch_httpd_auth] section is not
; consulted for it, so putting it there leaves the database world-readable to
; anything that can reach the port.
require_valid_user = true

; …except /_up, so the container healthcheck does not need credentials.
require_valid_user_except_for_up = true

; Request body limit for large vault syncs. LiveSync sends binary attachments.
max_http_request_size = 4294967296

; Enable CORS so the Obsidian mobile app (capacitor://) and desktop app
; (app://obsidian.md) can reach CouchDB from a different origin.
enable_cors = true

[httpd]
; CouchDB 3 still reads the CORS switch from [httpd] on some code paths —
; setting it in both places is harmless and avoids version-to-version surprises.
enable_cors = true

; Make CouchDB answer unauthenticated requests with a 401 + WWW-Authenticate
; challenge instead of a bare 401 body. LiveSync relies on this to authenticate.
WWW-Authenticate = Basic realm="couchdb"

[chttpd_auth]
; Session timeout in seconds (10 hours — comfortable for background sync).
timeout = 36000

[cors]
; Origins that are allowed to make cross-origin requests.
; - app://obsidian.md          → Obsidian desktop (Electron)
; - capacitor://localhost      → Obsidian iOS / Android (Capacitor)
; - http://localhost           → local dev / testing
origins = app://obsidian.md,capacitor://localhost,http://localhost

; Allow cookies / credentials in CORS requests (required by LiveSync auth)
credentials = true

; Allowed HTTP methods
methods = GET, PUT, POST, HEAD, DELETE, COPY

; Headers the browser is allowed to send
headers = accept, authorization, content-type, origin, referer, x-csrf-token, x-requested-with

[log]
; 'warning' in production to reduce noise; 'info' is useful during setup.
level = warning

[smoosh]
; Automatic compaction. CouchDB 2.x/3.x compaction is driven by the smoosh
; daemon — the CouchDB 1.x `[compactions]` section that used to be here is
; simply ignored by this version, so it never did anything.
;
; Restrict the ratio-triggered channels to the small hours: compaction rewrites
; whole database files, and on a USB SSD that is enough I/O to make interactive
; browsing feel slow.
db_channels = upgrade_dbs,ratio_dbs,slack_dbs
view_channels = upgrade_views,ratio_views,slack_views

[smoosh.ratio_dbs]
min_priority = 2.0
from = 01:00
to = 05:00
strict_window = true

[smoosh.ratio_views]
min_priority = 2.0
from = 01:00
to = 05:00
strict_window = true
