; zz-listen.conf — bind php-fpm to loopback.
;
; The official image ships /usr/local/etc/php-fpm.d/zz-docker.conf with
; `listen = 9000`, which means every interface. Normally that is fine: the
; container has its own network namespace and only Docker's bridge can reach it.
;
; Not here. Every service in this stack runs with
;   network_mode: service:tailscale
; so they share the Tailscale container's network stack — including its tailnet
; IP. `listen = 9000` would expose a completely unauthenticated FastCGI socket,
; which is remote code execution, to every device on the tailnet.
;
; This file sorts after zz-docker.conf and wins.
[www]
listen = 127.0.0.1:9000
