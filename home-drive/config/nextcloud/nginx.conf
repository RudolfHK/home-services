# nginx.conf — front end for the Nextcloud PHP-FPM container.
#
# Based on the configuration in the Nextcloud admin manual, adapted for two
# access paths into this one server: directly on the LAN (plain HTTP, no
# `tailscale serve` in front) and, if the optional Tailscale profile is
# running, through `tailscale serve` (which proxies here over plain HTTP
# internally but terminates real HTTPS on the client's side). Both need to
# reach Nextcloud correctly, so unlike a single-path setup this can't just
# hardcode `fastcgi_param HTTPS on`.
#
# Listens on plain 80 (not bound to 127.0.0.1): this is the LAN-facing port,
# published directly in docker-compose.yml, not shared with any other
# container's network namespace.

upstream php-handler {
    server nextcloud-app:9000;
}

# Assets requested with a ?v= cache-buster can be cached forever.
map $arg_v $asset_immutable {
    ""      "";
    default ", immutable";
}

# `tailscale serve` sets X-Forwarded-Proto: https when it proxies here,
# since it terminated real TLS on the client's side; a direct LAN request
# carries no such header at all. Trust the incoming header when present,
# otherwise fall back to $scheme (always "http" here, correctly, since this
# server itself never terminates TLS).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# PHP checks $_SERVER['HTTPS'] for the literal string "on", not a boolean —
# translate the resolved protocol into that exact value Nextcloud expects.
map $forwarded_proto $https_param {
    https   on;
    default "";
}

server {
    listen 80;
    server_name _;

    root /var/www/html;

    # Must be at least as large as PHP_UPLOAD_LIMIT, or big uploads die at the
    # proxy with a 413 that never reaches PHP.
    client_max_body_size 16G;
    client_body_timeout 300s;
    fastcgi_buffers 64 4K;

    # Long operations (file scans, big uploads, versions expiry) must not be
    # cut off mid-write — a truncated upload is exactly the corruption this
    # setup exists to avoid.
    fastcgi_read_timeout 3600s;
    fastcgi_send_timeout 3600s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

    # Pending big uploads are stored here, not in RAM.
    client_body_temp_path /tmp 1 2;

    add_header Referrer-Policy                   "no-referrer"       always;
    add_header X-Content-Type-Options            "nosniff"           always;
    add_header X-Frame-Options                   "SAMEORIGIN"        always;
    add_header X-Permitted-Cross-Domain-Policies "none"              always;
    add_header X-Robots-Tag                      "noindex, nofollow" always;
    add_header X-XSS-Protection                  "1; mode=block"     always;

    fastcgi_hide_header X-Powered-By;

    index index.php index.html /index.php$request_uri;

    # WebDAV clients that hit the root get sent to the DAV endpoint.
    location = / {
        if ( $http_user_agent ~ ^DavClnt ) {
            return 302 /remote.php/webdav/$is_args$args;
        }
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Service discovery for CalDAV/CardDAV clients. Nextcloud's own setup check
    # complains loudly if these are missing.
    location ^~ /.well-known {
        location = /.well-known/carddav { return 301 /remote.php/dav/; }
        location = /.well-known/caldav  { return 301 /remote.php/dav/; }
        location /.well-known/acme-challenge  { try_files $uri $uri/ =404; }
        location /.well-known/pki-validation  { try_files $uri $uri/ =404; }
        return 301 /index.php$request_uri;
    }

    # Never serve these over HTTP. `data` is the one that matters: it is the
    # users' files, and it lives inside the document root.
    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/)  { return 404; }
    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)                { return 404; }

    location ~ \.php(?:$|/) {
        # Only these entry points may be reached directly; everything else is
        # routed through index.php.
        rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocs-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;

        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;

        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        # Resolved above, per request, instead of hardcoded — see the two
        # map blocks at the top of this file for why a single fixed value
        # doesn't work here.
        fastcgi_param HTTPS $https_param;
        # nginx's own $remote_addr is only the real client IP for direct LAN
        # requests; for anything arriving via `tailscale serve`, it's that
        # container's own bridge-network IP. $proxy_add_x_forwarded_for
        # appends it correctly either way, and Nextcloud's own
        # `trusted_proxies` (zz-homedrive.config.php) is what makes it
        # trust this header instead of just using nginx's connecting IP.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_pass php-handler;

        fastcgi_intercept_errors on;
        # Stream uploads straight through instead of buffering the whole body
        # to disk first — the difference between a 10 GB upload working and
        # filling /tmp.
        fastcgi_request_buffering off;
        fastcgi_max_temp_file_size 0;
    }

    location ~ \.(?:css|js|mjs|svg|gif|png|jpg|ico|wasm|tflite|map|ogg|flac)$ {
        try_files $uri /index.php$request_uri;
        # add_header inside a location replaces the inherited set, so the
        # security headers have to be repeated here.
        add_header Cache-Control                     "public, max-age=15778463$asset_immutable";
        add_header Referrer-Policy                   "no-referrer"       always;
        add_header X-Content-Type-Options            "nosniff"           always;
        add_header X-Frame-Options                   "SAMEORIGIN"        always;
        add_header X-Permitted-Cross-Domain-Policies "none"              always;
        add_header X-Robots-Tag                      "noindex, nofollow" always;
        add_header X-XSS-Protection                  "1; mode=block"     always;
        access_log off;
    }

    location ~ \.woff2?$ {
        try_files $uri /index.php$request_uri;
        expires 7d;
        access_log off;
    }

    location /remote {
        return 301 /remote.php$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }
}
